<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>德克士餐饮群 2026Q1 KPI 考核看板</title>
<style>
:root{
  --primary:#00A6E7;
  --primary-dark:#0077B6;
  --primary-light:#90E0EF;
  --accent:#00D9A5;
  --bg0:#F0F8FF;
  --bg1:#E3F2FD;
  --bg2:#BBDEFB;
  --bg3:#FFFFFF;
  --text-dark:#1A237E;
  --text-main:#37474F;
  --text-light:#607D8B;
  --border:#90CAF9;
  --S:#00C853;
  --AP:#2196F3;
  --A:#00BCD4;
  --B:#FF5722;
  --gold:#FFC107;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',-apple-system,sans-serif;background:var(--bg0);color:var(--text-main);min-height:100vh}

/* HEADER */
.hd{background:linear-gradient(135deg,#E3F2FD,#BBDEFB 50%,#E3F2FD);border-bottom:2px solid var(--primary);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.hd-l{display:flex;align-items:center;gap:16px}
.brand{background:linear-gradient(135deg,#00A651,#00C853);border-radius:8px;padding:8px 18px;display:flex;align-items:center;font-size:18px;font-weight:800;color:#fff;font-family:'Arial Black',sans-serif;box-shadow:0 4px 15px rgba(0,102,83,.3)}
.hd-title h1{font-size:20px;font-weight:700;color:var(--text-dark);line-height:1.35}
.hd-title p{font-size:12px;color:var(--text-light);margin-top:4px}
.hd-r{text-align:right}
.date-chip{background:rgba(0,166,231,.12);border:1px solid var(--primary);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--primary-dark);display:inline-block;margin-bottom:8px}
.grade-row{display:flex;gap:8px;justify-content:flex-end}
.gp{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:800}
.gp.S{background:rgba(0,200,83,.12);color:var(--S);border:1px solid var(--S)}
.gp.AP{background:rgba(33,150,243,.12);color:var(--AP);border:1px solid var(--AP)}
.gp.A{background:rgba(0,188,212,.12);color:var(--A);border:1px solid var(--A)}
.gp.B{background:rgba(255,87,34,.12);color:var(--B);border:1px solid var(--B)}

/* TABS */
.tabs{background:var(--bg1);border-bottom:1px solid var(--border);display:flex;padding:0 28px;flex-wrap:wrap}
.tab{padding:13px 24px;font-size:14px;font-weight:600;color:var(--text-light);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.tab:hover{color:var(--primary)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);background:rgba(0,166,231,.05)}

/* MAIN */
.main{padding:22px 28px}
.panel{display:none}.panel.on{display:block}

/* STAT ROW */
.srow{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.scard{flex:1;min-width:120px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 18px;text-align:center;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.scard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sc-S::before{background:var(--S)}.sc-AP::before{background:var(--AP)}.sc-A::before{background:var(--A)}.sc-B::before{background:var(--B)}
.scard .sl{font-size:11px;color:var(--text-light);margin-bottom:7px}
.scard .sv{font-size:30px;font-weight:900}
.sc-S .sv{color:var(--S)}.sc-AP .sv{color:var(--AP)}.sc-A .sv{color:var(--A)}.sc-B .sv{color:var(--B)}
.scard .ss{font-size:10px;color:var(--text-light);margin-top:3px}

/* SECTION */
.csec{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:18px 22px;margin-bottom:22px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.csec-title{font-size:15px;font-weight:700;color:var(--primary-dark);margin-bottom:14px}
.csec-total{font-size:11px;color:var(--text-light);font-weight:400;margin-left:auto}

/* BAR ROWS */
.bars{overflow-y:auto;max-height:500px}
.brow{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;border-radius:8px;padding:8px 10px;transition:background .15s;border:1px solid transparent}
.brow:hover{background:rgba(0,166,231,.08);border-color:var(--border)}
.brow.expanded{background:rgba(0,166,231,.06);border-color:var(--primary)}
.brank{width:28px;text-align:center;font-size:13px;font-weight:700;color:var(--gold);flex-shrink:0}
.brank.r1{color:#FFD700;font-size:15px}.rank.r2{color:#C0C0C0}.rank.r3{color:#CD7F32}
.binfo{width:110px;flex-shrink:0}
.bname{font-size:13px;font-weight:700;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmeta{font-size:10px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgraph{flex:1;display:flex;align-items:center}
.bfbg{flex:1;height:8px;background:rgba(0,0,0,.05);border-radius:4px;overflow:hidden}
.bf{height:100%;border-radius:4px;transition:width .8s ease}
.bf-a{background:linear-gradient(90deg,#90A4AE,#B0BEC5)}
.bf-b{background:linear-gradient(90deg,#1565C0,#42A5F5)}
.bf-c{background:linear-gradient(90deg,#00A651,#4CAF50)}
.bv{width:50px;font-size:12px;font-weight:600;color:var(--text-dark);text-align:right;flex-shrink:0}
.bgrade{width:40px;flex-shrink:0;text-align:center}
.gpill{display:inline-block;padding:2px 8px;border-radius:9px;font-size:11px;font-weight:800}
.gpill.S{background:rgba(0,200,83,.12);color:var(--S);border:1px solid var(--S)}
.gpill.AP{background:rgba(33,150,243,.12);color:var(--AP);border:1px solid var(--AP)}
.gpill.A{background:rgba(0,188,212,.12);color:var(--A);border:1px solid var(--A)}
.gpill.B{background:rgba(255,87,34,.12);color:var(--B);border:1px solid var(--B)}

/* KPI DETAIL DROPDOWN */
.kpi-detail{display:none;padding:12px 16px;background:rgba(0,0,0,.02);border-radius:8px;margin-top:8px;border-left:3px solid var(--primary)}
.kpi-detail.show{display:block}
.dim-section{margin-bottom:12px}
.dim-section:last-child{margin-bottom:0}
.dim-title{font-size:12px;font-weight:700;color:var(--primary-dark);margin-bottom:8px;padding-bottom:4px;border-bottom:1px dashed var(--border)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.kpi-item{display:flex;justify-content:space-between;padding:5px 8px;background:rgba(0,0,0,.02);border-radius:4px;font-size:11px}
.kpi-name{color:var(--text-light)}
.kpi-val{font-weight:600;color:var(--text-dark)}
.kpi-val.pos{color:var(--S)}
.kpi-val.neg{color:var(--B)}
.dim-total{display:flex;justify-content:space-between;padding:8px 10px;background:rgba(0,166,231,.1);border-radius:4px;font-size:12px;font-weight:700;color:var(--primary-dark)}

/* LEGEND */
.sleg{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.sli{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-light)}
.sld{width:20px;height:6px;border-radius:3px}
.sla{background:linear-gradient(90deg,#90A4AE,#B0BEC5)}
.slb{background:linear-gradient(90deg,#1565C0,#42A5F5)}
.slc{background:linear-gradient(90deg,#00A651,#4CAF50)}

/* INFO TIP */
.itip{background:rgba(255,152,0,.07);border:1px solid rgba(255,152,0,.28);border-radius:8px;padding:10px 14px;font-size:12px;color:#E65100;margin-bottom:16px}

/* ADJUSTMENT SECTION */
.adj-section{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
.adj-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.adj-card-title{font-size:13px;font-weight:700;color:var(--primary-dark);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.adj-table{width:100%;border-collapse:collapse;font-size:11px}
.adj-table th{text-align:left;padding:6px 8px;background:var(--bg1);color:var(--text-light);font-weight:600}
.adj-table td{padding:6px 8px;border-bottom:1px solid rgba(0,0,0,.05);color:var(--text-dark)}
.adj-table tr:hover td{background:rgba(0,166,231,.05)}

/* MODAL */
.moverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.moverlay.on{display:flex}
.modal{background:var(--bg3);border:1px solid var(--primary);border-radius:14px;width:min(900px,95vw);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.mhd{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg1)}
.mhd h3{font-size:15px;font-weight:700;color:var(--primary-dark)}
.mclose{width:28px;height:28px;background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.3);border-radius:50%;color:#F44336;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .2s}
.mclose:hover{background:rgba(244,67,54,.2)}
.mbody{padding:16px 20px;overflow-y:auto;flex:1}
.mdesc{font-size:12px;color:var(--text-light);margin-bottom:12px;padding:8px 12px;background:rgba(0,166,231,.06);border-radius:6px;border-left:3px solid var(--primary)}
table.dtbl{width:100%;border-collapse:separate;border-spacing:0 3px}
table.dtbl th{font-size:10px;font-weight:700;color:var(--text-light);text-align:left;padding:5px 8px;background:var(--bg1)}
table.dtbl td{font-size:11px;padding:6px 8px;background:rgba(0,0,0,.02);color:var(--text-dark)}
table.dtbl tr:hover td{background:rgba(0,166,231,.07)}

/* FOOTER */
.footer{text-align:center;padding:12px;color:var(--text-light);font-size:10px;border-top:1px solid var(--border);background:var(--bg1);margin-top:auto}

/* Expand button */
.expand-btn{margin-left:auto;padding:4px 10px;background:rgba(0,166,231,.1);border:none;border-radius:12px;color:var(--primary);font-size:10px;cursor:pointer;transition:all .2s}
.expand-btn:hover{background:rgba(0,166,231,.2)}
.expand-btn.on{background:var(--primary);color:#fff}
</style>
</head>

// ==================== HELPERS ====================
const GC = g => g==='S'?'S':g==='A+'?'AP':g==='A'?'A':'B';
const fmt = v => v != null ? (typeof v === 'number' ? v.toFixed(2) : v) : '—';
const pct = (v, mx) => Math.min(100, ((v||0) / mx) * 100).toFixed(1);

// ==================== BUILD STATS ====================
function buildStats(data, cid){
  const c={S:0,'A+':0,A:0,B:0};
  data.forEach(p=>{const g=p.grade||'B';if(c[g]!==undefined)c[g]++;else c.B++});
  document.getElementById(cid).innerHTML=`
    <div class="scard sc-S"><div class="sl">🟢 S</div><div class="sv">${c.S}</div><div class="ss">人</div></div>
    <div class="scard sc-AP"><div class="sl">🔵 A+</div><div class="sv">${c['A+']}</div><div class="ss">人</div></div>
    <div class="scard sc-A"><div class="sl">🩵 A</div><div class="sv">${c.A}</div><div class="ss">人</div></div>
    <div class="scard sc-B"><div class="sl">🔴 B</div><div class="sv">${c.B}</div><div class="ss">人</div></div>`;
}

// ==================== KPI DETAIL HTML ====================
function buildKpiDetail(p){
  let html = '<div class="kpi-detail">';
  
  // Financial
  html += '<div class="dim-section"><div class="dim-title">💰 财务维度</div><div class="kpi-grid">';
  p.fin_kpis.forEach((k,i) => {
    const isRate = i % 2 === 0;
    const valClass = k.val > 0 ? 'pos' : k.val < 0 ? 'neg' : '';
    html += `<div class="kpi-item"><span class="kpi-name">${k.name}</span><span class="kpi-val ${valClass}">${fmt(k.val)}${isRate?'%':'分'}</span></div>`;
  });
  html += '</div></div>';
  
  // Customer
  html += '<div class="dim-section"><div class="dim-title">😊 顾客维度</div><div class="kpi-grid">';
  p.cust_kpis.forEach((k,i) => {
    const isRate = i % 2 === 0;
    const valClass = k.val > 0 ? 'pos' : k.val < 0 ? 'neg' : '';
    html += `<div class="kpi-item"><span class="kpi-name">${k.name}</span><span class="kpi-val ${valClass}">${fmt(k.val)}${isRate?'%':'分'}</span></div>`;
  });
  html += '</div></div>';
  
  // Operations
  html += '<div class="dim-section"><div class="dim-title">⚙️ 组织运营维度</div><div class="kpi-grid">';
  p.ops_kpis.forEach((k,i) => {
    const isRate = i % 2 === 0;
    const valClass = k.val > 0 ? 'pos' : k.val < 0 ? 'neg' : '';
    html += `<div class="kpi-item"><span class="kpi-name">${k.name}</span><span class="kpi-val ${valClass}">${fmt(k.val)}${isRate?'%':'分'}</span></div>`;
  });
  html += '</div></div>';
  
  // Learning
  html += '<div class="dim-section"><div class="dim-title">📚 学习与发展维度</div>';
  html += `<div class="dim-total"><span>${p.lrn_kpis[0].name}</span><span>${fmt(p.lrn_kpis[0].val)} 分</span></div>`;
  html += '</div>';
  
  html += '</div>';
  return html;
}

// ==================== BUILD BARS (ZONG) ====================
function buildBarsZong(data, cid, nid){
  const sorted=[...data].sort((a,b)=>b.score_gm-a.score_gm);
  document.getElementById(nid).textContent=sorted.length;
  const el=document.getElementById(cid); el.innerHTML='';
  
  sorted.forEach((p,i)=>{
    const rank=i+1;
    const rk=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank;
    const rc=rank===1?'r1':rank===2?'r2':rank===3?'r3':'';
    const gc=GC(p.grade);
    
    const row=document.createElement('div');
    row.className='brow';
    row.id=`zrow-${i}`;
    row.innerHTML=`
      <div class="brank ${rc}">${rk}</div>
      <div class="binfo">
        <div class="bname">${p.name}</div>
        <div class="bmeta">${p.area}</div>
      </div>
      <div class="bgraph">
        <div class="bfbg"><div class="bf bf-a" style="width:${pct(p.score_total,150)}%"></div></div>
        <div class="bv">${fmt(p.score_total)}</div>
      </div>
      <div class="bgraph">
        <div class="bfbg"><div class="bf bf-b" style="width:${pct(p.score_adj,150)}%"></div></div>
        <div class="bv">${fmt(p.score_adj)}</div>
      </div>
      <div class="bgraph">
        <div class="bfbg"><div class="bf bf-c" style="width:${pct(p.score_gm,150)}%"></div></div>
        <div class="bv">${fmt(p.score_gm)}</div>
      </div>
      <div class="bgrade"><span class="gpill ${gc}">${p.grade}</span></div>
      <button class="expand-btn" onclick="toggleDetail('z',${i})">展开明细 ▾</button>`;
    row.innerHTML += buildKpiDetail(p);
    el.appendChild(row);
  });
}

  DATA.adj2.forEach(a=>{
    html2 += `<tr><td>${a.area}</td><td>${a.name}</td><td>${a.target_revenue}</td><td>${a.actual_revenue}</td><td>${a.target_stores}</td><td>${a.actual_stores}</td><td>${a.score}</td></tr>`;
  });
  html2 += '</tbody></table></div>';
  
  el.innerHTML = html1 + html2;
}

// ==================== TOGGLE ====================
function toggleDetail(type, idx){
  const row = document.getElementById(`${type}row-${idx}`);
  const btn = row.querySelector('.expand-btn');
  const detail = row.querySelector('.kpi-detail');
  if(detail.classList.contains('show')){
    detail.classList.remove('show');
    btn.classList.remove('on');
    btn.textContent = '展开明细 ▾';
    row.classList.remove('expanded');
  } else {
    detail.classList.add('show');
    btn.classList.add('on');
    btn.textContent = '收起明细 ▴';
    row.classList.add('expanded');
  }
}

// ==================== TAB ====================
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  const idx={zong:0,fu:1,adj:2}[name];
  document.querySelectorAll('.tab')[idx].classList.add('on');
  document.querySelectorAll('.panel')[idx].classList.add('on');
}

// ==================== MODAL ====================
function closeMod(e){
  if(!e||e.target===document.getElementById('mov')||e.target.closest('.mclose')){
    document.getElementById('mov').classList.remove('on');
  }
}

  buildStats(DATA.fu_xi,'st-fu');
  buildBarsFu(DATA.fu_xi,'bars-fu','n-fu');
  buildAdj();
});
